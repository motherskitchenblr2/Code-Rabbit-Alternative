# =============================================================================
# Git-Fix Docker Compose Override - Local Development
# =============================================================================
# This file is automatically loaded by docker-compose
# Run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# =============================================================================

version: '3.8'

services:
  # Override API for hot-reload development
  api:
    build:
      target: development
    environment:
      - FLASK_DEBUG=true
      - FLASK_ENV=development
      - WERKZEUG_DEBUG_PIN=off
    volumes:
      - .:/app:cached
      - /app/backend/__pycache__
    command: >
      flask run
      --host=0.0.0.0
      --port=5000
      --debugger
      --reload
      --with-threads

  # Frontend with hot reload
  frontend:
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app/frontend:cached
      - frontend_node_modules:/app/frontend/node_modules

  # Worker with auto-reload
  worker:
    command: >
      celery -A app.celery worker
      --loglevel=info
      --concurrency=2
      --pool=prefork
      --autoscale=4,1
      --max-tasks-per-child=100
      --without-gossip
      --without-mingle
      --without-heartbeat

  # Disable healthchecks for faster startup in dev
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitfix -d gitfix"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  qdrant:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Add development tools
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gitfix-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gitfix-network
    profiles:
      - dev

  minio:
    image: minio/minio:RELEASE.2023-10-14T19-39-20Z
    container_name: gitfix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gitfix-network
    profiles:
      - dev

volumes:
  minio_data:
    driver: local