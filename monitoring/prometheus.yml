# =============================================================================
# Prometheus Configuration for Git-Fix
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'gitfix-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Git-Fix API metrics
  - job_name: 'gitfix-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'gitfix-api'
          environment: 'development'

  # Git-Fix Worker (Celery)
  - job_name: 'gitfix-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:5000']
        labels:
          service: 'gitfix-worker'
          environment: 'development'

  # Frontend (if exposing metrics)
  - job_name: 'gitfix-frontend'
    static_configs:
      - targets: ['frontend:5173']
        labels:
          service: 'gitfix-frontend'
          environment: 'development'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          environment: 'development'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          environment: 'development'

  # Qdrant
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          environment: 'development'

  # Flower (Celery monitoring)
  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']
        labels:
          service: 'flower'
          environment: 'development'

  # Node Exporter (if running)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
          environment: 'development'

  # cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'cadvisor'
          environment: 'development'