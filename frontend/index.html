<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Git-Fix - Cyberpunk Code Review Engine Dashboard" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Git-Fix | Cyberpunk Code Review Engine</title>
    <script>
      try {
        var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        var a = localStorage.getItem('accent') || 'magenta'
        var d = document.documentElement
        d.classList.remove('dark', 'light')
        d.classList.add(t === 'light' ? 'light' : 'dark')
        d.setAttribute('data-accent', a)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cyber-900 text-cyber-100 font-sans antialiased selection:bg-neon-magenta selection:text-cyber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
