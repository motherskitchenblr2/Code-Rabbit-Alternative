# =============================================================================
# Git-Fix Docker Compose - Production Override
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.8'

services:
  # Production API with Gunicorn
  api:
    build:
      target: production
    environment:
      - FLASK_DEBUG=false
      - FLASK_ENV=production
      - WERKZEUG_DEBUG_PIN=off
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Production Worker with more workers
  worker:
    command: celery -A app.celery worker --loglevel=info --concurrency=8 --pool=prefork --autoscale=16,4 --max-tasks-per-child=1000 --without-gossip --without-mingle --without-heartbeat
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s

  # Production Scheduler
  scheduler:
    command: celery -A app.celery beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Production Frontend (Nginx + Static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: gitfix-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - gitfix-network
    profiles:
      - production
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: gitfix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - gitfix-network
    restart: unless-stopped
    profiles:
      - production
    deploy:
      replicas: 1

  # Certbot for SSL
  certbot:
    image: certbot/certbot:v2.7.0
    container_name: gitfix-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./nginx/conf.d:/etc/nginx/conf.d
    command: certonly --webroot -w /var/www/certbot --force-renewal --email admin@gitfix.io --agree-tos --no-eff-email -d gitfix.io -d www.gitfix.io
    profiles:
      - production
    deploy:
      restart_policy:
        condition: none

  # Production Database with replication
  postgres:
    image: postgres:15-alpine
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Redis with persistence
  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Qdrant with persistence
  qdrant:
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gitfix-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 2G

  # Grafana
  grafana:
    image: grafana/grafana:10.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - gitfix-network
    profiles:
      - production

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - gitfix-network
    profiles:
      - production

  # Promtail for log shipping
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - gitfix-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  minio_data:
    driver: local
  frontend_node_modules:
    driver: local
  celerybeat_schedule:
    driver: local